rules:
  - id: polarion-xxe-unsafe-parser
    languages: [java]
    severity: ERROR
    message: |
      XML parser instantiated without XXE protection. Polarion extensions
      that parse user-supplied XML (settings imports, FOP/iText input,
      JAX-RS payloads) are reachable by any authenticated user; an
      attacker can submit a DOCTYPE with `&xxe;` references that the
      parser dereferences server-side, leaking files or making outbound
      requests from the Polarion host.

      Set the relevant feature/property before parsing:

        // DocumentBuilderFactory
        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        // SAXParserFactory
        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        // XMLInputFactory (StAX)
        factory.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
        factory.setProperty(XMLInputFactory.SUPPORT_DTD, false);

      OR delegate parsing to a hardened helper class.

      See <https://github.com/SchweizerischeBundesbahnen/github-workflows-polarion/blob/main/polarion-semgrep-rules/README.md>.
    metadata:
      category: security
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
        - "CWE-776: Improper Restriction of Recursive Entity References"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      polarion-rule: true
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    pattern-either:
      # Each hardening clause is a `pattern-not-inside` over the enclosing
      # method rather than a `pattern-not-regex` over the matched region. Two
      # reasons, both measured on semgrep 1.172.0. The region ends at
      # `newSAXParser()`, so `parser.setProperty(ACCESS_EXTERNAL_DTD, "")` — the
      # only SAX route to that property, because SAXParserFactory has no
      # setAttribute and no setProperty — sat outside it and hardened SAX code
      # was reported at ERROR. And a regex is applied to the region as TEXT, so a
      # comment naming `disallow-doctype-decl` silenced the rule entirely.
      # Matching the configuring call structurally fixes both, and keeps the
      # region — hence the finding count — exactly as it was.
      #
      # ACCESS_EXTERNAL_DTD set to "" is the alternative OWASP documents where
      # DOCTYPE cannot be disabled, so it clears the rule. The empty value is
      # part of the pattern: `ACCESS_EXTERNAL_DTD, "file"` still resolves file://
      # external entities, so accepting the constant name alone would clear the
      # rule on code that is still exposed. ACCESS_EXTERNAL_SCHEMA is not
      # accepted on its own — restricting schema resolution does nothing about
      # DOCTYPE processing or external general entities. FEATURE_SECURE_PROCESSING
      # is not accepted either: OWASP records that it "may not always mitigate
      # entity expansion" and treats it as supplementary.
      #
      # `$QUALIFIER.ACCESS_EXTERNAL_DTD` matches the constant however it is
      # written — `XMLConstants.ACCESS_EXTERNAL_DTD`, the fully qualified
      # `javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD`, and the bare form left by
      # a static import. KNOWN LIMITATION: hardening outside a method body does
      # not clear the rule, because every clause is scoped to a method.
      - patterns:
          - pattern-either:
              - pattern: |
                  $FACTORY = DocumentBuilderFactory.newInstance();
                  ...
                  $FACTORY.newDocumentBuilder();
              - pattern: |
                  $FACTORY = SAXParserFactory.newInstance();
                  ...
                  $FACTORY.newSAXParser();
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $X.setFeature("=~/disallow-doctype-decl/", true);
                ...
              }
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $X.setAttribute($QUALIFIER.ACCESS_EXTERNAL_DTD, "");
                ...
              }
          # The parser-level route, reachable only after newSAXParser().
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $X.setProperty($QUALIFIER.ACCESS_EXTERNAL_DTD, "");
                ...
              }
      - patterns:
          - pattern: |
              $FACTORY = XMLInputFactory.newInstance();
              ...
              $FACTORY.createXMLStreamReader(...);
          # Either property alone clears the StAX branch, and the value is part
          # of the pattern for the same reason it is above.
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $X.setProperty($QUALIFIER.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
                ...
              }
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $X.setProperty($QUALIFIER.SUPPORT_DTD, false);
                ...
              }
