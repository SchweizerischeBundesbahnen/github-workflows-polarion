rules:
  - id: polarion-xxe-unsafe-parser
    languages: [java]
    severity: ERROR
    message: |
      XML parser instantiated without XXE protection. Polarion extensions
      that parse user-supplied XML (settings imports, FOP/iText input,
      JAX-RS payloads) are reachable by any authenticated user; an
      attacker can submit a DOCTYPE with `&xxe;` references that the
      parser dereferences server-side, leaking files or making outbound
      requests from the Polarion host.

      Set the relevant feature/property before parsing:

        // DocumentBuilderFactory
        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        // SAXParserFactory
        factory.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        // XMLInputFactory (StAX)
        factory.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
        factory.setProperty(XMLInputFactory.SUPPORT_DTD, false);

      OR delegate parsing to a hardened helper class.

      See <https://github.com/SchweizerischeBundesbahnen/github-workflows-polarion/blob/main/polarion-semgrep-rules/README.md>.
    metadata:
      category: security
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
        - "CWE-776: Improper Restriction of Recursive Entity References"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      polarion-rule: true
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    pattern-either:
      # Hardening is matched as a CALL, not as a regex over the matched region.
      # A regex is applied to the region as text, which cost a false negative:
      # a comment naming `disallow-doctype-decl` silenced the rule outright.
      #
      # Each factory-level clause is a `pattern-not` carrying the creation call,
      # so the hardening has to sit on the SAME receiver the positive pattern
      # binds AND between `newInstance()` and the creation. Scoping those
      # clauses to the enclosing method instead — which is the obvious way to
      # write this — is both receiver-blind and order-blind, and measurably so:
      # hardening one factory cleared a second unhardened factory in the same
      # method, and a `setFeature` call placed AFTER `newDocumentBuilder()`,
      # where it cannot affect that builder, cleared the rule as well. Semgrep
      # unifies `$FACTORY` from the positive pattern into these clauses, which is
      # what makes the receiver binding hold; measured on 1.172.0.
      #
      # That order discipline is why the DOM, SAX and StAX branches do not share
      # one `pattern-either` over their creation calls: the call that has to come
      # last differs per branch, so it has to be named in each.
      #
      # ACCESS_EXTERNAL_DTD set to "" is the alternative OWASP documents where
      # DOCTYPE cannot be disabled, so it clears the rule. The empty value is
      # part of the pattern: `ACCESS_EXTERNAL_DTD, "file"` still resolves file://
      # external entities, so accepting the constant name alone would clear the
      # rule on code that is still exposed. ACCESS_EXTERNAL_SCHEMA is not
      # accepted on its own — restricting schema resolution does nothing about
      # DOCTYPE processing or external general entities. FEATURE_SECURE_PROCESSING
      # is not accepted either: OWASP records that it "may not always mitigate
      # entity expansion" and treats it as supplementary.
      #
      # `$QUALIFIER.ACCESS_EXTERNAL_DTD` matches the constant however it is
      # written — `XMLConstants.ACCESS_EXTERNAL_DTD`, the fully qualified
      # `javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD`, and the bare form left by a
      # static import. KNOWN LIMITATION: hardening delegated to a helper method
      # or performed in a constructor does not clear the rule, because every
      # clause requires the call in the same statement sequence.
      - patterns:
          - pattern: |
              $FACTORY = DocumentBuilderFactory.newInstance();
              ...
              $FACTORY.newDocumentBuilder();
          - pattern-not: |
              $FACTORY = DocumentBuilderFactory.newInstance();
              ...
              $FACTORY.setFeature("=~/disallow-doctype-decl/", true);
              ...
              $FACTORY.newDocumentBuilder();
          - pattern-not: |
              $FACTORY = DocumentBuilderFactory.newInstance();
              ...
              $FACTORY.setAttribute($QUALIFIER.ACCESS_EXTERNAL_DTD, "");
              ...
              $FACTORY.newDocumentBuilder();
      - patterns:
          - pattern: |
              $FACTORY = SAXParserFactory.newInstance();
              ...
              $FACTORY.newSAXParser();
          - pattern-not: |
              $FACTORY = SAXParserFactory.newInstance();
              ...
              $FACTORY.setFeature("=~/disallow-doctype-decl/", true);
              ...
              $FACTORY.newSAXParser();
          # The parser-level route. SAXParserFactory has neither setAttribute nor
          # setProperty, so this is the only SAX way to ACCESS_EXTERNAL_DTD, and
          # it is necessarily reached AFTER newSAXParser() on a different object
          # — hence a method-scoped clause here rather than a `pattern-not`. The
          # receiver is still bound: $PARSER is the object newSAXParser()
          # returned, and $FACTORY unifies with the positive pattern. KNOWN
          # LIMITATION, and the one place the rule is deliberately order-free:
          # this clause is ordered against the creation call only, so a
          # setProperty after the parse call — equally useless — is not reported.
          # The positive pattern ends at newSAXParser() rather than at the parse.
          - pattern-not-inside: |
              $RET $METHOD(...) {
                ...
                $PARSER = $FACTORY.newSAXParser();
                ...
                $PARSER.setProperty($QUALIFIER.ACCESS_EXTERNAL_DTD, "");
                ...
              }
      - patterns:
          - pattern: |
              $FACTORY = XMLInputFactory.newInstance();
              ...
              $FACTORY.createXMLStreamReader(...);
          # Either property alone clears the StAX branch, and the value is part
          # of the pattern for the same reason it is above.
          - pattern-not: |
              $FACTORY = XMLInputFactory.newInstance();
              ...
              $FACTORY.setProperty($QUALIFIER.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
              ...
              $FACTORY.createXMLStreamReader(...);
          - pattern-not: |
              $FACTORY = XMLInputFactory.newInstance();
              ...
              $FACTORY.setProperty($QUALIFIER.SUPPORT_DTD, false);
              ...
              $FACTORY.createXMLStreamReader(...);
