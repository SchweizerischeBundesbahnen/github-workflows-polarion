# polarion.properties (vulnerable)
#
# The values are deliberately low-entropy and identical: the rule fires on any
# value that is not a placeholder, so a fixture does not need to look like a
# real credential — and one that does trips every secret scanner in CI.
# ruleid: polarion-hardcoded-creds-config
db.password=fixture-not-a-secret
# ruleid: polarion-hardcoded-creds-config
ldap.password=fixture-not-a-secret
# ruleid: polarion-hardcoded-creds-config
admin.password=fixture-not-a-secret
# ruleid: polarion-hardcoded-creds-config
api.key=fixture-not-a-secret
# ruleid: polarion-hardcoded-creds-config
mail.password=fixture-not-a-secret
# Value ending in `=`, the shape of base64 padding. A `'=\s*$'` suppression
# clause used to exempt it, which silently excused every base64-encoded secret.
# The value itself is kept low-entropy so no secret scanner flags the fixture.
# ruleid: polarion-hardcoded-creds-config
jdbc.password=fixture-not-a-secret=
