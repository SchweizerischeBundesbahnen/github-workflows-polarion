---
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude_types: [markdown]  # Avoid conflicts with markdown formatting
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/grigoriev/pre-commit-check-git-user
    rev: v0.9.3
    hooks:
      - id: check-git-config-user-email
        args: [--templates, ^\S+\.\S+@sbb\.ch$]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  # kjanat/actionlint, the maintained successor to rhysd/actionlint, whose last
  # commit is 2026-04-19 (rhysd/actionlint#719). This must stay in step with the
  # actionlint that `reviewdog/action-actionlint` bundles in CI — the action
  # exposes no input to choose it, so a divergence here means the commit gate
  # and CI disagree about whether a workflow is valid.
  # Pinned to the COMMIT, because this hook compiles and runs on the developer's
  # machine and a git tag is mutable. `08bb2c4` is what v1.17.0 points at — the
  # ref itself resolves to an annotated tag OBJECT (`2da2ceb`), which is only
  # reachable through the ref that names it, so pinning that would break for
  # everyone the moment upstream moved or deleted the tag.
  #
  # The `# frozen:` suffix is load-bearing rather than decorative: Renovate's
  # pre-commit manager recognises a digest only in the `<sha>  # frozen: <tag>`
  # form (lib/modules/manager/pre-commit/extract.ts), so a bare SHA here would
  # silently stop receiving updates.
  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # frozen: v1.17.0
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: claude-tool-list-parity
        name: Assert claude-code-action tool lists agree
        entry: .github/scripts/check_tool_list_parity.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^\.github/workflows/.*\.ya?ml$
