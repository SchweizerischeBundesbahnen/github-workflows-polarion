# gitleaks configuration
#
# Extends the bundled rule set. The only addition is an allowlist for the
# Semgrep rule fixtures: `hardcoded-creds-config.vuln.properties` has to contain
# non-placeholder credential values, because that is precisely what the rule it
# tests must fire on. The values are synthetic (`sk_live_4242424242` is the
# well-known test card number), and the fixed-case fixture beside it shows the
# placeholder forms the rule accepts.
[extend]
useDefault = true

[allowlist]
description = "Semgrep rule fixtures carry deliberately fake credentials"
paths = [
  '''^polarion-semgrep-rules/tests/fixtures/''',
]
