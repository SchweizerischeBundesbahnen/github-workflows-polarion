# Automatic Analysis is on for this project (sonar.autoscan.enabled=true), and it
# IGNORES sonar-project.properties -- this file is the only lever on analysis
# scope short of disabling Automatic Analysis and wiring a CI-based scan.
#
# Without it Automatic Analysis derives the scope from pom.xml, whose Maven
# layout has no src/ directory, so exactly one file is indexed (pom.xml, 15 lines
# of XML) and the githubactions rules never run on a single workflow. Measured
# 2026-09-16 against the components API: 1 file indexed, 0 issues, 0 hotspots.
#
# The scope is the workflows directory and nothing else. Do NOT widen it to `.`:
# polarion-semgrep-rules/tests/fixtures/ holds 14 deliberately vulnerable Java
# files, which would be reported as real findings against this repository.
#
# Wildcard patterns are not allowed in this file, so the scope has to be named as
# directories and paths. That covers every reusable-*.yml and every caller.
sonar.sources=.github/workflows,pom.xml
