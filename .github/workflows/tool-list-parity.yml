---
name: Tool list parity
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
      - .github/scripts/check_tool_list_parity.py
  workflow_dispatch:
permissions: {}
jobs:
  tool-list-parity:
    name: Assert claude-code-action tool lists agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # Fails when a tool is declared in settings.permissions.allow but not in
      # claude_args --allowedTools, or the reverse. The first direction fails
      # silently at runtime, which is why it is asserted here.
      #
      # nullglob so an unmatched *.yaml is dropped rather than passed through as
      # a literal filename. Both extensions, matching the pre-commit hook's
      # ^\.github/workflows/.*\.ya?ml$ — CI is the binding gate, so it must not
      # check less than the advisory hook does.
      #
      # uv rather than pip, matching reusable-pr.yml: --no-build resolves from
      # wheels only, so nothing runs a setup script during installation, and the
      # pyyaml version is pinned. That pin is the one .pre-commit-config.yaml
      # gives the same script through additional_dependencies — keep the two in
      # step, or the advisory hook and the binding gate run different code.
      - run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          uv run --no-project --no-build --with pyyaml==6.0.3 \
            .github/scripts/check_tool_list_parity.py "${workflows[@]}"
