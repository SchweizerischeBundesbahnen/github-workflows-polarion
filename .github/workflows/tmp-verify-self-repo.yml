# once it has run green, per the CLAUDE.md convention.
name: TEMP verify self-repository syntax
on:
  push:
    branches: [ci/actionlint-fork-align]
permissions: {}
jobs:
  verify:
    uses: $/.github/workflows/reusable-actionlint.yml
    permissions:
      checks: write
      contents: read
      pull-requests: read
