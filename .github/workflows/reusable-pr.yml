---
name: PR checks (reusable)
on:
  workflow_call:
    inputs:
      python-version:
        description: Unused since commitizen runs through uv, which supplies its own Python. Kept so existing callers keep working.
        required: false
        type: string
        default: "3.x"
permissions: {}
jobs:
  check-conventional-commit:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uvx --no-build --from commitizen==4.18.0 cz check --rev-range "$BASE_SHA..$HEAD_SHA"
