---
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Weekly, off-peak Sunday — matches the cadence default setup uses.
    - cron: 17 5 * * 0
permissions: {}
jobs:
  analyze:
    # This repository holds workflows and a Semgrep rule pack, so `actions` is
    # the only language CodeQL has anything to extract here.
    uses: $/.github/workflows/reusable-codeql-js-actions.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["actions"]'
