---
name: OpenAPI Validation (reusable)
on:
  workflow_call:
    inputs:
      spec-path:
        description: Path to the OpenAPI spec file (e.g. docs/openapi.json)
        required: true
        type: string
      node-version:
        description: Node.js version for redocly CLI
        required: false
        type: string
        default: "24"
      redocly-args:
        description: Additional arguments for redocly lint
        required: false
        type: string
        default: ""
permissions: {}
jobs:
  validate-openapi:
    name: Validate OpenAPI Definition
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate OpenAPI definition
        env:
          SPEC_PATH: ${{ inputs.spec-path }}
          REDOCLY_ARGS: ${{ inputs.redocly-args }}
        shell: bash
        run: |
          # shellcheck disable=SC2086
          npx @redocly/cli@latest lint "$SPEC_PATH" --format=github-actions $REDOCLY_ARGS
