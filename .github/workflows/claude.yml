---
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
permissions: {}
jobs:
  claude:
    uses: $/.github/workflows/reusable-claude.yml
    # `issue_comment` and `issues` are low-trust triggers, so their cache
    # access defaults to read-only — but a called workflow can request more
    # unless the caller caps it. Neither side caches anything, so `none` is the
    # honest cap.
    cache-mode: none
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
