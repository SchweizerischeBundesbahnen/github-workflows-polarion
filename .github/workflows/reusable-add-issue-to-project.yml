---
name: Add issue to project (reusable)
on:
  workflow_call:
    secrets:
      POLARION_GITHUB_APP_ID:
        required: true
      POLARION_GITHUB_APP_PRIVATE_KEY:
        required: true
    inputs:
      project-number:
        description: The GitHub project number to add the issue to
        required: true
        type: string
permissions: {}
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.POLARION_GITHUB_APP_ID }}
          private-key: ${{ secrets.POLARION_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd  # v2
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/${{ inputs.project-number }}
          github-token: ${{ steps.app-token.outputs.token }}
