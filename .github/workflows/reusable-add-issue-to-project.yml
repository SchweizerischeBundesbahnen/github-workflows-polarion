---
name: Add issue to project (reusable)
on:
  workflow_call:
    secrets:
      POLARION_GITHUB_APP_ID:
        required: true
      POLARION_GITHUB_APP_PRIVATE_KEY:
        required: true
    inputs:
      project-number:
        description: The GitHub project number to add the issue to
        required: true
        type: string
permissions: {}
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.POLARION_GITHUB_APP_ID }}
          private-key: ${{ secrets.POLARION_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05  # v2
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/${{ inputs.project-number }}
          github-token: ${{ steps.app-token.outputs.token }}
