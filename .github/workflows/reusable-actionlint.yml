---
name: ActionLint (reusable)
on:
  workflow_call:
    inputs:
      reporter:
        description: "Reviewdog reporter: github-check or github-pr-check"
        required: false
        type: string
        default: github-check
      fail_level:
        description: "Fail level: error, warning, info"
        required: false
        type: string
        default: error
permissions: {}
jobs:
  actionlint:
    name: Check GitHub Actions Workflows
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true  # Required: reviewdog needs git credentials for diff fetch on private repos
      - name: Run actionlint
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e  # v1.74.0
        with:
          github_token: ${{ github.token }}
          reporter: ${{ inputs.reporter }}
          fail_level: ${{ inputs.fail_level }}
          level: error
          filter_mode: nofilter
